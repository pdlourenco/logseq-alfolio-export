name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # CI sets a fixed fast-check seed (see the property test files), so a
      # failure here is reproducible locally with CI=1 npm test. Locally the
      # seed is random, which is what keeps finding new cases.
      - run: npm test
        env:
          CI: true
